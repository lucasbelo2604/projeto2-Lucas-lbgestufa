# CCM520 - Internet das Coisas | Projeto 2 - Estufa inteligente na plataforma FIWARE
# Mosquitto 2.x: broker LOCAL do IoT Agent + PONTE (bridge) com o broker PÚBLICO da HiveMQ.
#
#   ESP32 / Wokwi --MQTT--> broker.hivemq.com <==ponte==> Mosquitto local <--MQTT--> IoT Agent JSON
#                           (público, internet)          (este arquivo)            (sem alterações)
#
# Por que uma ponte? O IoT Agent JSON assina os tópicos com uma assinatura compartilhada
# ($share/json/...). Ligado direto ao broker público, ele dividiria as medidas com os IoT Agents
# de toda a turma (e de qualquer pessoa no mundo). Aqui ele fica sozinho no broker local, e a
# ponte só deixa passar os tópicos da SUA API key. Leia o Material de apoio, seção 3.
#
# Depois de editar: docker compose up -d   (ou docker compose restart mosquitto)
# Para conferir:    docker compose logs mosquitto

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------------------------------------------------------------------------
# Broker local (SEM autenticação: apenas para laboratório)
#   IoT Agent .......... mosquitto:1883 (dentro da rede Docker)
#   seu computador ..... localhost:1883 (mosquitto_sub, MQTTX)
# ---------------------------------------------------------------------------
listener 1883
allow_anonymous true

# ---------------------------------------------------------------------------
# Ponte com o broker público
# ---------------------------------------------------------------------------
connection hivemq

# O endereço e porta (MQTT sem TLS) do broker público, no formato host:porta.
#         São os mesmos do firmware do Projeto 1.
address broker.hivemq.com:1883

# Client ID exclusivo configurado para a ponte deste grupo.
remote_clientid ponte_lbgestufa

cleansession true

# Exigências do broker público da HiveMQ (NÃO altere): sem estas linhas o broker
# recusa a conexão da ponte e ela fica conectando e desconectando.
try_private false
notifications false
bridge_protocol_version mqttv311

# Filtros MQTT restritos aos tópicos da API key e do dispositivo deste grupo.
#
#   topic <padrão> <direção> <qos>
#     <padrão> ... filtro MQTT com curinga (# ou +), SEMPRE com a SUA API key
#     <direção> .. in  = do broker PÚBLICO para o LOCAL (o que a estufa publica)
#                  out = do broker LOCAL para o PÚBLICO (o que o IoT Agent publica)
#     <qos> ...... 0
#
#   Use a tabela de tópicos do IoT Agent JSON (README, passo 1.3).
#   NÃO use a direção "both" nem o padrão "#" sozinho: "#" traz para o seu computador o
#   tráfego do broker público inteiro, e "both" pode fazer mensagens voltarem pela ponte
#   (a proteção contra laços depende do try_private, que o HiveMQ não aceita).
#
topic /json/lbgestufa/estufa2604/attrs in 0
topic /json/lbgestufa/estufa2604/cmdexe in 0
topic /lbgestufa/estufa2604/cmd out 0
